[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NSMFermions"
version = "0.1.1"
description = "Quantum Machine Learning Fermions utilities"
authors = [
    { name = "Emanuele Costa", email = "emanuele.costa@icc.ub.edu" }
]
dependencies = [
    "numpy",
    "scipy",
    "pfapack>=0.3.1",
]
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
